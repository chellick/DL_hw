seed: 42

data:
  eval_manifest: assets/toy_math_vqa/manifest.jsonl
  split: dev
  max_samples: null

model:
  vision_encoder: google/vit-base-patch16-224
  language_model: Qwen/Qwen2-0.5B-Instruct
  adapter_path: artifacts/adapter.safetensors
  lora_path: null

processor:
  image_size: 224
  num_tiles: 1
  num_image_tokens: 49
  max_length: 384
  ignore_index: -100
  vit_normalize: true

inference:
  device: auto
  max_new_tokens: 64
  output_path: artifacts/predictions.jsonl
